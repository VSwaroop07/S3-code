<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S3 File Manager</title>
  <style>
    :root {
      --navy: #102a43;
      --blue: #1677ff;
      --blue-dark: #0958d9;
      --text: #1f2937;
      --muted: #697586;
      --border: #e7edf4;
      --surface: #ffffff;
      --background: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 10%, rgba(22, 119, 255, 0.08), transparent 28rem),
        linear-gradient(135deg, #f8fafc 0%, var(--background) 100%);
    }

    .shell {
      max-width: 1060px;
      margin: 0 auto;
      padding: 24px 28px 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 64px;
      margin-bottom: 28px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #1677ff, #0c5dd1);
      box-shadow: 0 8px 18px rgba(22, 119, 255, 0.22);
    }

    .brand-mark svg { width: 23px; height: 23px; }

    .topbar h1 {
      margin: 0;
      color: var(--navy);
      font-size: 21px;
      letter-spacing: -0.02em;
    }

    .topbar span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.06);
    }

    .upload-card { padding: 22px; }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--navy);
      font-size: 16px;
    }

    .heading-icon {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 9px;
      color: var(--blue);
      background: #edf4ff;
    }

    .heading-icon svg { width: 17px; height: 17px; }

    #uploadForm {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-picker {
      position: relative;
      min-height: 156px;
      border: 1.5px dashed #b9c9dc;
      border-radius: 12px;
      background: #fafcff;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .file-picker:hover {
      border-color: var(--blue);
      background: #f5f9ff;
    }

    .file-picker input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-picker-content {
      display: flex;
      min-height: 156px;
      padding: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    .file-picker-icon {
      display: grid;
      width: 44px;
      height: 44px;
      margin-bottom: 10px;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      background: #edf4ff;
    }

    .file-picker-icon svg { width: 21px; height: 21px; }

    .file-picker strong { color: var(--navy); font-size: 14px; }
    .file-picker small { margin-top: 6px; color: var(--muted); }

    .primary-button,
    .refresh-button,
    .action-button {
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .primary-button {
      width: 100%;
      height: 44px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 7px 14px rgba(22, 119, 255, 0.16);
    }

    .primary-button:hover {
      background: var(--blue-dark);
      box-shadow: 0 9px 18px rgba(22, 119, 255, 0.22);
      transform: translateY(-1px);
    }

    #status {
      min-height: 18px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .files-card { overflow: hidden; }

    .files-header {
      display: flex;
      min-height: 72px;
      padding: 16px 20px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .files-header h2 {
      margin: 0;
      color: var(--navy);
      font-size: 16px;
    }

    .refresh-button {
      display: inline-flex;
      height: 36px;
      padding: 0 13px;
      align-items: center;
      gap: 7px;
      color: #3d5268;
      background: #f1f5f9;
    }

    .refresh-button:hover { background: #e7eef7; }
    .refresh-button svg { width: 15px; height: 15px; }

    #files {
      margin: 0;
      padding: 8px 20px 12px;
      list-style: none;
    }

    #files li {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 72px;
      border-bottom: 1px solid #edf1f5;
      word-break: break-all;
    }

    #files li:last-child { border-bottom: 0; }

    .file-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 10px;
      color: #537087;
      background: #eef3f8;
    }

    .file-icon svg { width: 21px; height: 21px; }

    .file-details { min-width: 0; }
    .file-name {
      overflow: hidden;
      color: #26384a;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .file-actions {
      display: flex;
      gap: 7px;
    }

    .action-button {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: #53677b;
      background: #f3f6f9;
    }

    .action-button:hover { color: var(--blue); background: #edf4ff; }
    .action-button.delete:hover { color: #d92d20; background: #fff0ee; }
    .action-button svg { width: 16px; height: 16px; }

    .empty-state {
      display: grid;
      min-height: 260px;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    .empty-state svg {
      width: 40px;
      height: 40px;
      margin-bottom: 10px;
      color: #aebcca;
    }

    @media (max-width: 760px) {
      .shell { padding: 16px 16px 40px; }
      .topbar { margin-bottom: 18px; }
      .grid { grid-template-columns: 1fr; }
      #files { padding-inline: 14px; }
      #files li { grid-template-columns: 42px minmax(0, 1fr) auto; }
    }

    @media (max-width: 430px) {
      .file-actions { flex-direction: column; }
      .action-button { width: 32px; height: 32px; }
      #files li { gap: 9px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M5 5.5c0-1.1 3.1-2 7-2s7 .9 7 2-3.1 2-7 2-7-.9-7-2Z"/>
          <path d="M5 5.5v13c0 1.1 3.1 2 7 2s7-.9 7-2v-13"/>
          <path d="M5 12c0 1.1 3.1 2 7 2s7-.9 7-2"/>
        </svg>
      </div>
      <div>
        <h1>S3 File Manager</h1>
        <span>Amazon S3 storage workspace</span>
      </div>
    </header>

    <div class="grid">
      <section class="card upload-card" aria-labelledby="upload-heading">
        <h2 class="card-heading" id="upload-heading">
          <span class="heading-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>
            </svg>
          </span>
          Upload file
        </h2>
        <form id="uploadForm">
          <label class="file-picker">
            <input type="file" name="file" required>
            <span class="file-picker-content">
              <span class="file-picker-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>
                </svg>
              </span>
              <strong>Choose a file</strong>
              <small>Browse from your device</small>
            </span>
          </label>
          <button class="primary-button" type="submit">Upload to S3</button>
        </form>
        <p id="status" role="status"></p>
      </section>

      <section class="card files-card" aria-labelledby="files-heading">
        <div class="files-header">
          <h2 id="files-heading">Stored files</h2>
          <button class="refresh-button" type="button" onclick="loadFiles()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.3 5.7M20 11V5m0 6h-6"/>
            </svg>
            Refresh
          </button>
        </div>
        <ul id="files"></ul>
      </section>
    </div>
  </main>
  <script>
    const statusBox = document.getElementById("status");

    function formatBytes(bytes) {
      if (!bytes) return "0 bytes";
      const units = ["bytes", "KB", "MB", "GB"];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const value = index === 0 ? bytes : (bytes / Math.pow(1024, index)).toFixed(1);
      return `${value} ${units[index]}`;
    }

    async function loadFiles() {
      const response = await fetch("/api/files");
      const files = await response.json();
      const list = document.getElementById("files");
      list.innerHTML = "";
      if (!files.length) {
        list.innerHTML = `
          <li class="empty-state">
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M3.5 7.5h17v11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-11Z"/>
                <path d="M3.5 7.5l2-4h13l2 4M9 12h6"/>
              </svg>
              <div>No files uploaded yet</div>
            </div>
          </li>`;
        return;
      }
      files.forEach(file => {
        const li = document.createElement("li");

        const icon = document.createElement("div");
        icon.className = "file-icon";
        icon.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M6 2.5h8l4 4v15H6v-19Z"/>
            <path d="M14 2.5v4h4M9 11h6M9 14h6M9 17h4"/>
          </svg>`;

        const details = document.createElement("div");
        details.className = "file-details";
        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = file.key;
        const meta = document.createElement("div");
        meta.className = "file-meta";
        meta.textContent = formatBytes(file.size);
        details.append(name, meta);

        const actions = document.createElement("div");
        actions.className = "file-actions";

        const download = document.createElement("button");
        download.type = "button";
        download.className = "action-button";
        download.title = "Download";
        download.setAttribute("aria-label", `Download ${file.key}`);
        download.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14"/>
          </svg>`;
        download.onclick = async () => {
          const r = await fetch("/api/download/" + encodeURIComponent(file.key));
          const data = await r.json();
          window.open(data.url, "_blank");
        };

        const del = document.createElement("button");
        del.type = "button";
        del.className = "action-button delete";
        del.title = "Delete";
        del.setAttribute("aria-label", `Delete ${file.key}`);
        del.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/>
          </svg>`;
        del.onclick = async () => {
          await fetch("/api/files/" + encodeURIComponent(file.key), {method:"DELETE"});
          loadFiles();
        };

        actions.append(download, del);
        li.append(icon, details, actions);
        list.appendChild(li);
      });
    }
    document.getElementById("uploadForm").addEventListener("submit", async e => {
      e.preventDefault();
      statusBox.textContent = "Uploading...";
      const response = await fetch("/api/upload", {method:"POST", body:new FormData(e.target)});
      const data = await response.json();
      statusBox.textContent = data.message || "Request completed";
      if (response.ok) { e.target.reset(); loadFiles(); }
    });
    loadFiles();
  </script>
</body>
</html>
